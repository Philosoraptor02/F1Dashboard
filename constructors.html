<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constructor Standings — Formula 1 Season Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/constructors.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="assets/f1-logo.svg">
</head>

<body class="dark-mode">

    <header>
        <div class="logo-container">
            <img src="assets/f1-logo.svg" alt="Formula 1 Logo" id="f1-logo">
        </div>
        <h1>Constructor Standings</h1>

        <div class="controls">
            <label for="colorblind-toggle">Colorblind Mode</label>
            <button id="colorblind-toggle" aria-pressed="false">Toggle</button>
        </div>

        <nav aria-label="Main navigation">
            <a href="index.html">Standings</a>
            <a href="races.html">Races</a>
            <a href="drivers.html">Drivers</a>
            <a href="constructors.html" aria-current="page">Constructors</a>
        </nav>
    </header>

    <main class="single-column">
        <section id="constructors-section" aria-labelledby="constructors-heading">
            <h2 id="constructors-heading">2026 Constructor Championship</h2>

            <div id="constructors-loading" class="ui-state">Loading constructor standings from Jolpica F1...</div>
            <div id="constructors-error" class="ui-state hidden" aria-live="assertive"></div>

            <div id="constructors-loaded" class="table-wrapper hidden">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th scope="col">Pos</th>
                            <th scope="col">Constructor</th>
                            <th scope="col">Nationality</th>
                            <th scope="col">Wins</th>
                            <th scope="col">Points</th>
                        </tr>
                    </thead>
                    <tbody id="constructors-body">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Built by Mike H. and Liam M. for COSC 219. Data provided by <a href="https://jolpi.ca/"
                target="_blank">Jolpica
                F1 API</a>.</p>
    </footer>

</body>

</html>
